# Configuração do analyzer e linter para summary_app.
# Baseado em package:flutter_lints/flutter.yaml com regras extras curadas.
# Referência completa: https://dart.dev/lints

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Trata imports não utilizados como erro (não apenas warning)
    unused_import: error
    # Trata variáveis locais não utilizadas como erro
    unused_local_variable: error
    # Trata elementos deprecados como warning
    deprecated_member_use: warning

  exclude:
    - "**/*.g.dart"      # gerados por build_runner
    - "**/*.freezed.dart"

linter:
  rules:
    # ── Estilo ────────────────────────────────────────────────────────────────
    prefer_single_quotes: true          # consistência de strings
    always_declare_return_types: true   # explicitar tipo de retorno
    annotate_overrides: true            # sempre usar @override
    require_trailing_commas: true       # facilita formatação e diffs
    directives_ordering: true           # imports organizados

    # ── Segurança / Boas práticas ─────────────────────────────────────────────
    avoid_print: true                   # usar logger ao invés de print
    avoid_empty_else: true
    avoid_returning_null_for_void: true
    avoid_shadowing_type_parameters: true
    avoid_types_as_parameter_names: true
    cancel_subscriptions: true          # não esquecer de cancelar StreamSubscription
    close_sinks: true                   # fechar Sinks corretamente
    no_duplicate_case_values: true
    use_build_context_synchronously: true  # evitar context após await

    # ── Flutter específico ────────────────────────────────────────────────────
    sized_box_for_whitespace: true      # SizedBox > Container vazio
    use_full_hex_values_for_flutter_colors: true
    avoid_unnecessary_containers: true  # remover Container sem propósito
    prefer_const_constructors: true     # const onde possível (performance)
    prefer_const_literals_to_create_immutables: true
    use_colored_box: true               # ColoredBox > Container(color:...)
    use_decorated_box: true             # DecoratedBox > Container(decoration:...)

    # ── Dart moderno ──────────────────────────────────────────────────────────
    prefer_final_locals: true           # preferir final em variáveis locais
    unnecessary_this: true              # remover `this.` desnecessário
    unnecessary_new: true               # remover `new` desnecessário
    unnecessary_const: true             # remover `const` redundante
    prefer_is_empty: true               # list.isEmpty > list.length == 0
    prefer_is_not_empty: true
    eol_at_end_of_file: true            # linha em branco no fim do arquivo
